# Connector source-IP allow-list for /api/connector/* (nginx `geo` syntax: CIDR VALUE;).
# 1 = allowed, 0 = 403 at the edge.
#
# DEFAULT DENY. Connectors already authenticate every request (Ed25519 signature + nonce + timestamp);
# this list is defence in depth so that an unknown network cannot even reach the connector API.
#
# One file PER BANK in allowlists/connectors.d/<bank-slug>.conf (template: connectors.d/example-bank.conf.example),
# each entry with the bank's change ticket, and ONE explicit include line per bank below (nginx `geo` does
# not expand wildcards — the explicit list is also the reviewable inventory of enabled banks). Reload:
#   docker compose -f docker-compose.prod.yml --env-file .env.production exec nginx nginx -s reload
#
# Per-bank enforcement: the list is shared by all banks (connectors are told apart by their keys, not by
# path). For strict "bank A's key only from bank A's IPs" binding, give each bank its own hostname
# (bank-a.connect.example.com) with its own server block + geo map, or rely on the app-level check.
#
# PILOT / LAB ONLY ("open"): replace `default 0;` with `default 1;` to accept connectors from any IP
# (signatures still enforced). Record the exception in the change ticket and revert before go-live.
default 0;

# --- enabled banks (one line each; keep sorted)
# include /etc/nginx/allowlists/connectors.d/bank-a.conf;
