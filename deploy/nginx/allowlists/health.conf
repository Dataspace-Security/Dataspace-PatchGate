# /api/ready source-IP allow-list (nginx `geo` syntax: CIDR 1;). Everyone else gets 404.
# /api/health (liveness, no details) stays public for external uptime probes.
#
# Default: loopback + private ranges (load balancer / monitoring on the internal health network, and the
# smoke test run on the host). NARROW THIS to your load balancer and monitoring IPs in production.
127.0.0.1/32    1;
10.0.0.0/8      1;
172.16.0.0/12   1;
192.168.0.0/16  1;
