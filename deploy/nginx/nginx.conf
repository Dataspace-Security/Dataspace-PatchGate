# PatchGate edge: TLS termination, load balancing to web-1/web-2, request limits, connector allow-list.
# Requires nginx >= 1.27.3 (upstream `resolve` in open-source nginx). Default image: nginx:1.28-alpine.
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
  worker_connections 8192;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  # ---- logging: JSON lines (no query strings: they could carry tokens; no cookies/auth headers)
  log_format json escape=json '{"ts":"$time_iso8601","level":"info","msg":"http.access","component":"nginx",'
    '"remote":"$remote_addr","host":"$host","method":"$request_method","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"durationS":$request_time,"upstream":"$upstream_addr",'
    '"upstreamStatus":"$upstream_status","upstreamS":"$upstream_response_time","requestId":"$request_id",'
    '"ua":"$http_user_agent","tls":"$ssl_protocol"}';
  access_log /dev/stdout json;

  # ---- timeouts / sizes (overridden per location below)
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  keepalive_requests 1000;
  client_header_timeout 15s;
  client_body_timeout 30s;
  send_timeout 60s;
  client_max_body_size 1m;
  client_body_buffer_size 128k;
  large_client_header_buffers 4 16k;
  reset_timedout_connection on;

  # ---- Docker embedded DNS: re-resolve web-1/web-2 when containers are recreated
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # ---- rate limits (edge, per client IP). The app applies finer per-route/per-connector limits too.
  # Bank connectors usually sit behind one NAT IP per bank: keep their zone generous.
  limit_req_zone $binary_remote_addr zone=pg_general:20m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=pg_auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=pg_connector:20m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=pg_conn:20m;
  limit_req_status 429;
  limit_conn_status 429;

  # ---- source-IP allow-lists (deploy/nginx/allowlists/, reload nginx after editing)
  # Connector API: default DENY; per-bank files in allowlists/connectors.d/ (see connectors.conf).
  geo $connector_ip_allowed {
    # `default` lives in the included file (default 0 = enforce the list; default 1 = open, pilots only).
    include /etc/nginx/allowlists/connectors.conf;
  }
  # Legacy WSUS scripts (/api/wsus/*): default deny (404). Opt-in per legacy bank.
  geo $wsus_ip_allowed {
    default 0;
    include /etc/nginx/allowlists/wsus.conf;
  }
  # Package repository (/repo/*): default deny (404) in the hosted deployment.
  geo $repo_ip_allowed {
    default 0;
    include /etc/nginx/allowlists/repo.conf;
  }
  # Readiness (/api/ready): internal health network / load balancer only.
  geo $health_ip_allowed {
    default 0;
    include /etc/nginx/allowlists/health.conf;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
  }

  upstream patchgate_web {
    zone patchgate_web 128k;
    # Passive health: an instance failing 3 times in 15 s is skipped for 15 s. Container HEALTHCHECK +
    # `depends_on: service_healthy` cover start-up. No sticky sessions (sessions live in PostgreSQL).
    server web-1:3000 resolve max_fails=3 fail_timeout=15s;
    server web-2:3000 resolve max_fails=3 fail_timeout=15s;
    keepalive 64;
  }

  include /etc/nginx/conf.d/*.conf;
}
