# Example: PatchGate Connector next to a bank site's Tactical RMM server.
#
# One-time enrolment (config dir must be writable for this step only):
#   docker run --rm -it --read-only \
#     -v /etc/patchgate-connector:/etc/patchgate-connector \
#     -v /var/lib/patchgate-connector:/var/lib/patchgate-connector \
#     -e PATCHGATE_ENROLL_CODE=XXXX-XXXX-XXXX-XXXX-XXXX \
#     patchgate-connector:1.0.0 init --server https://patchgate.example.com --ca /etc/patchgate-connector/patchgate-ca.pem
#   (init rewrites connector.json atomically: the host directory must be writable by uid 1000 for this step,
#    e.g. chown 1000 /etc/patchgate-connector; afterwards chown it back to root, the service mounts it read-only)
#
# Then: docker compose -f docker-compose.example.yml up -d
services:
  patchgate-connector:
    image: patchgate-connector:1.0.0
    restart: unless-stopped
    command: ["run"]
    read_only: true
    user: "1000:1000"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - /etc/patchgate-connector:/etc/patchgate-connector:ro # connector.json, tactical-api-key, CA + cache TLS cert/key
      - /var/lib/patchgate-connector:/var/lib/patchgate-connector # key, journal, cache index, packages (chown 1000, mode 0700)
    ports:
      - "8443:8443" # package cache for PCs (bank LAN only; restrict with the host firewall)
    stop_grace_period: 90s # > limits.shutdownGraceSec
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    mem_limit: 512m
    cpus: 2
